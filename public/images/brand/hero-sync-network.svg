  <text x="723" y="188" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="10.5">Mods In Sync (ETS2)</text>

  <rect x="612" y="246" width="222" height="128" rx="14" fill="#151D2B" stroke="#1E293B" stroke-width="1.6"/>
  <circle cx="640" cy="278" r="10" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="640" cy="278" r="4" fill="#10B981"/>
  <text x="658" y="282" fill="#F5F7FA" font-family="Figtree, system-ui, sans-serif" font-size="13.5" font-weight="700">Approved Member PC #2</text>
  <text x="632" y="308" fill="#A7B0C0" font-family="Figtree, system-ui, sans-serif" font-size="11.5">Desktop Client Connected</text>
  <rect x="632" y="324" width="182" height="28" rx="6" fill="#080B12" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="723" y="342" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="10.5">Mods In Sync (ETS2)</text>

  <rect x="612" y="400" width="222" height="128" rx="14" fill="#151D2B" stroke="#1E293B" stroke-width="1.6"/>
  <circle cx="640" cy="432" r="10" fill="#00F0FF" fill-opacity="0.2"/>
  <circle cx="640" cy="432" r="4" fill="#00F0FF"/>
  <text x="658" y="436" fill="#F5F7FA" font-family="Figtree, system-ui, sans-serif" font-size="13.5" font-weight="700">Approved Member PC #3</text>
  <text x="632" y="462" fill="#A7B0C0" font-family="Figtree, system-ui, sans-serif" font-size="11.5">Desktop Client Connected</text>
  <rect x="632" y="478" width="182" height="28" rx="6" fill="#080B12" stroke="#00F0FF" stroke-opacity="0.5"/>
  <text x="723" y="496" text-anchor="middle" fill="#00F0FF" font-family="monospace" font-size="10.5">Mods In Sync (ATS)</text>

  <!-- Connection Lines -->
  <path d="M286 175 L320 235" stroke="#8B5CF6" stroke-width="2.2" stroke-dasharray="5 4"/>
  <path d="M320 355 L286 420" stroke="#00F0FF" stroke-width="2.2" stroke-dasharray="5 4"/>
  <path d="M560 250 L612 156" stroke="#00F0FF" stroke-width="2.2"/>
  <path d="M560 295 L612 310" stroke="#00F0FF" stroke-width="2.2"/>
  <path d="M560 340 L612 464" stroke="#00F0FF" stroke-width="2.2"/>
