  <text x="440" y="245" text-anchor="middle" fill="#F5F7FA" font-family="Figtree, system-ui, sans-serif" font-size="17" font-weight="800">GhostModsSync Hub</text>
  <text x="440" y="265" text-anchor="middle" fill="#A7B0C0" font-family="Figtree, system-ui, sans-serif" font-size="11.5">Isolated Private VTC Library</text>

  <!-- Mod Manifest Rows inside Central Hub -->
  <rect x="342" y="282" width="196" height="30" rx="6" fill="#080B12" stroke="#1E293B"/>
  <circle cx="358" cy="297" r="4" fill="#00F0FF"/>
  <text x="370" y="301" fill="#F5F7FA" font-family="monospace" font-size="11">vtc_skin_pack_v2.4.scs</text>

  <rect x="342" y="320" width="196" height="30" rx="6" fill="#080B12" stroke="#1E293B"/>
  <circle cx="358" cy="335" r="4" fill="#8B5CF6"/>
  <text x="370" y="339" fill="#F5F7FA" font-family="monospace" font-size="11">convoy_sound_fix.scs</text>

  <rect x="342" y="358" width="196" height="30" rx="6" fill="#080B12" stroke="#1E293B"/>
  <circle cx="358" cy="373" r="4" fill="#10B981"/>
  <text x="370" y="377" fill="#F5F7FA" font-family="monospace" font-size="11">steam_workshop_mod</text>

