<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" fill="none" role="img" aria-label="GhostModsSync Centralised VTC Synchronisation Architecture">
  <defs>
    <linearGradient id="hero-cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="hero-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="860" height="600" rx="22" fill="#101522" stroke="#1E293B" stroke-width="2"/>
  <circle cx="440" cy="310" r="280" fill="url(#hero-glow)"/>

