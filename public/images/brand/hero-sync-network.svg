  <text x="64" y="450" fill="#A7B0C0" font-family="Figtree, system-ui, sans-serif" font-size="12">• Checks local files vs manifest</text>
  <text x="64" y="470" fill="#A7B0C0" font-family="Figtree, system-ui, sans-serif" font-size="12">• Syncs to local mod folder</text>
  <rect x="64" y="492" width="204" height="38" rx="6" fill="#080B12" stroke="#1E293B"/>
  <text x="76" y="510" fill="#00F0FF" font-family="monospace" font-size="10">Documents\...\mod\</text>
  <text x="76" y="523" fill="#10B981" font-family="monospace" font-size="9.5">Status: Matched &amp; Synchronised</text>

