  <!-- NODE 1: VTC LEADER (TOP LEFT) -->
  <rect x="46" y="88" width="240" height="175" rx="14" fill="#151D2B" stroke="#8B5CF6" stroke-width="1.8"/>
  <rect x="64" y="106" width="128" height="22" rx="6" fill="#231942"/>
