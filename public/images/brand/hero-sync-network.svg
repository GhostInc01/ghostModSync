  <text x="64" y="152" fill="#F5F7FA" font-family="Figtree, system-ui, sans-serif" font-size="15" font-weight="700">Web Platform Control</text>
  <text x="64" y="174" fill="#A7B0C0" font-family="Figtree, system-ui, sans-serif" font-size="12">• Uploads private VTC mods</text>
  <text x="64" y="194" fill="#A7B0C0" font-family="Figtree, system-ui, sans-serif" font-size="12">• Organises mod versions</text>
  <text x="64" y="214" fill="#A7B0C0" font-family="Figtree, system-ui, sans-serif" font-size="12">• Approves VTC members</text>
  <rect x="64" y="226" width="204" height="22" rx="5" fill="#080B12" stroke="#334155"/>
  <text x="166" y="241" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="10">Leader Approval: REQUIRED</text>

  <!-- NODE 2: CENTRAL GHOSTMODSSYNC PLATFORM (CENTER) -->
  <rect x="320" y="175" width="240" height="240" rx="18" fill="#151D2B" stroke="url(#hero-cyan-purple)" stroke-width="2.5"/>
  <rect x="348" y="195" width="184" height="24" rx="12" fill="#0B2938"/>
