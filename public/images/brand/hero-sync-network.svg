  <rect x="46" y="345" width="240" height="205" rx="14" fill="#151D2B" stroke="#00F0FF" stroke-width="1.6"/>
  <rect x="64" y="363" width="150" height="22" rx="6" fill="#0B2938"/>
  <text x="139" y="378" text-anchor="middle" fill="#00F0FF" font-family="Figtree, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em">2. DESKTOP CLIENT APP</text>
  <text x="64" y="408" fill="#F5F7FA" font-family="Figtree, system-ui, sans-serif" font-size="15" font-weight="700">Local Mod Verification</text>
